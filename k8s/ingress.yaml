# Wymaga zainstalowanego Ingress Controller (nginx):
#   minikube addons enable ingress
#   lub: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/...
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audio-rag-ingress
  namespace: audio-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size:       "30m"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: audio-rag.local
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: audio-rag-api-service
                port:
                  number: 80
