apiVersion: v1
kind: ConfigMap
metadata:
  name: audio-rag-config
  namespace: audio-rag
data:
  CHROMADB_HOST:      "chromadb-service"
  CHROMADB_PORT:      "8000"
  CHROMA_COLLECTION:  "transcriptions"
  WHISPER_MODEL:      "small"
  EMBEDDING_MODEL:    "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  LLM_PROVIDER:       "gemini"
  MAX_FILE_SIZE_MB:   "25"
  PORT:               "8000"
