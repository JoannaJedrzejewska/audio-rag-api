services:
  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=1
      - ANONYMIZED_TELEMETRY=False

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - ${DOCKER_DNS_SERVER:-168.63.129.16}
    environment:
      - CHROMADB_HOST=host.docker.internal
      - CHROMADB_PORT=8001
    depends_on:
      - chromadb

volumes:
  chroma_data:
